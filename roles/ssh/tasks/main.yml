---
# IAC-LNX-05: SSH root login is disabled
# IAC-LNX-06: SSH authentication is hardened
#
# Ubuntu reads /etc/ssh/sshd_config.d/*.conf FIRST (first value wins),
# so a drop-in file is the correct place for these settings.

- name: Identify the account Ansible logs in as (guard rail for lockout)
  ansible.builtin.set_fact:
    ssh_login_user: "{{ ansible_user | default('root') }}"

- name: Ensure the sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make sure the main sshd_config includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload sshd

- name: Deploy the hardened SSH configuration
  ansible.builtin.template:
    src: 99-iac-baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/99-iac-baseline.conf
    owner: root
    group: root
    mode: "0600"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload sshd

- name: Read the effective SSH configuration
  ansible.builtin.command: sshd -T
  register: iac_sshd_effective
  changed_when: false
  check_mode: false

- name: Show the effective values of the hardened settings
  ansible.builtin.debug:
    msg: >-
      {{ iac_sshd_effective.stdout_lines
      | select('match', '^(permitrootlogin|passwordauthentication|maxauthtries|x11forwarding|permitemptypasswords|logingracetime|allowtcpforwarding|clientaliveinterval)')
      | list }}

# Guard rail: never lock the administrator out of a password-only setup.
- name: Refuse to disable password authentication while no keys are deployed
  ansible.builtin.stat:
    path: "/home/{{ ssh_login_user }}/.ssh/authorized_keys"
  register: iac_authorized_keys
  when: not (ssh_password_authentication | bool)

- name: Fail when password auth would be disabled without an SSH key
  ansible.builtin.fail:
    msg: >-
      ssh_password_authentication is "no" but
      /home/{{ ssh_login_user }}/.ssh/authorized_keys does not exist.
      You would lock yourself out. Deploy an SSH key and test it first.
  when:
    - not (ssh_password_authentication | bool)
    - not iac_authorized_keys.stat.exists
