---
# IAC-LNX-10: system logging and log rotation are available and persistent
- name: Install logging and log rotation packages
  ansible.builtin.apt:
    name:
      - rsyslog
      - logrotate
    state: present

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make the journal persistent with a size limit
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-iac-baseline.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by {{ baseline_name }} v{{ baseline_version }}
      [Journal]
      Storage=persistent
      SystemMaxUse={{ journald_max_use }}
      SystemMaxFileSize={{ journald_max_file_size }}
      Compress=yes
      ForwardToSyslog=yes
  notify: Restart journald

- name: Ensure the logrotate timer is enabled and running
  ansible.builtin.systemd:
    name: logrotate.timer
    enabled: true
    state: started

- name: Validate the logrotate configuration
  ansible.builtin.command: logrotate --debug /etc/logrotate.conf
  register: iac_logrotate_check
  changed_when: false
  failed_when: iac_logrotate_check.rc not in [0, 1]
  check_mode: false

- name: Confirm the journal is being written to disk
  ansible.builtin.command: journalctl --disk-usage
  register: iac_journal_usage
  changed_when: false
  check_mode: false

- name: Show the journal disk usage
  ansible.builtin.debug:
    msg: "{{ iac_journal_usage.stdout }}"
