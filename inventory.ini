# Lab topology
#
#   iac-controller (Kali)   192.168.1.7   user youwe   runs Ansible, NOT managed
#        |
#        +-- target1  linux_cis     192.168.1.11   user youwe
#        +-- target2  linux_server2 192.168.1.14   user uv
#
# All three VMs sit on the same NAT network (192.168.1.0/24).

[linux_servers]
target1 ansible_host=192.168.1.11 ansible_user=youwe
target2 ansible_host=192.168.1.14 ansible_user=uv

[linux_servers:vars]
ansible_python_interpreter=/usr/bin/python3

# The controller itself is deliberately NOT in this group: a benchmark should
# not modify the box that holds its own SSH keys and playbooks.
#
# Run against one host only:
#   ansible-playbook -i inventory.ini site.yml --limit target1 -K
