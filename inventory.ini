# Lab topology
#
#   iac-controller (Kali)   192.168.x.xx   user youwe   runs Ansible, NOT managed
#        |
#        +-- target1  linux_cis     192.168.x.xx   user username
#        +-- target2  linux_server2 192.168.x.xx   user username
#
# All three VMs sit on the same NAT network (192.168.1.0/24).

[linux_servers]
target1 ansible_host=ip of vm ansible_user=username_vm
target2 ansible_host=ip of vm ansible_user=username_vm

[linux_servers:vars]
ansible_python_interpreter=/usr/bin/python3

# The controller itself is deliberately NOT in this group: a benchmark should
# not modify the box that holds its own SSH keys and playbooks.
#
# Run against one host only:
#   ansible-playbook -i inventory.ini site.yml --limit target1 -K
